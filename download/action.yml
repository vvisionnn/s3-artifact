name: "Download a Build Artifact from S3"
description: "Drop-in replacement for actions/download-artifact that reads artifacts from any S3-compatible bucket."
author: "vvisionnn"
branding:
  icon: "download-cloud"
  color: "blue"
inputs:
  name:
    description: "Name of the artifact to download. If unspecified, all artifacts for the run are downloaded."
    required: false
  artifact-ids:
    description: "IDs of the artifacts to download, comma-separated. Either `artifact-ids` or `name` can be used, but not both."
    required: false
  path:
    description: "Destination path. Supports basic tilde expansion. Defaults to $GITHUB_WORKSPACE."
    required: false
  pattern:
    description: "A glob pattern matching the artifacts that should be downloaded. Ignored if name is specified."
    required: false
  merge-multiple:
    description: "When multiple artifacts are matched: if true, they are all extracted into `path`; if false, each goes into a directory named after it."
    required: false
    default: "false"
  github-token:
    description: "Accepted for compatibility and ignored: artifacts are read from S3, so other repositories and runs only need `repository` and `run-id`."
    required: false
  repository:
    description: "The repository (owner/name) whose artifacts are downloaded."
    required: false
    default: ${{ github.repository }}
  run-id:
    description: "The workflow run whose artifacts are downloaded."
    required: false
    default: ${{ github.run_id }}
  skip-decompress:
    description: "If true, the downloaded artifact is kept as-is (e.g. `name.zip`) instead of being extracted."
    required: false
    default: "false"
  digest-mismatch:
    description: "Behavior when an artifact's SHA-256 digest does not match: `ignore`, `info`, `warn` or `error` (default, fails without extracting the corrupted data)."
    required: false
    default: "error"
  s3-bucket:
    description: "Bucket that stores the artifacts. Falls back to `ARTIFACT_S3_BUCKET`."
  s3-endpoint:
    description: "S3 endpoint URL, e.g. `https://s3.example.com`. Falls back to `ARTIFACT_S3_ENDPOINT`, `AWS_ENDPOINT_URL_S3`, `AWS_ENDPOINT_URL`, then AWS S3 for the region."
  s3-region:
    description: "Signing region. Falls back to `ARTIFACT_S3_REGION`, `AWS_REGION`, `AWS_DEFAULT_REGION`, then `us-east-1`."
  s3-access-key-id:
    description: "Access key ID. Falls back to `ARTIFACT_S3_ACCESS_KEY_ID`, then `AWS_ACCESS_KEY_ID`."
  s3-secret-access-key:
    description: "Secret access key. Falls back to `ARTIFACT_S3_SECRET_ACCESS_KEY`, then `AWS_SECRET_ACCESS_KEY`."
  s3-session-token:
    description: "Optional session token for temporary credentials. Falls back to `ARTIFACT_S3_SESSION_TOKEN`, then `AWS_SESSION_TOKEN`."
  s3-prefix:
    description: "Optional key prefix inside the bucket. Falls back to `ARTIFACT_S3_PREFIX`."
  s3-force-path-style:
    description: "Use path-style URLs (`endpoint/bucket/key`). Defaults to `true` for custom endpoints and `false` for AWS. Falls back to `ARTIFACT_S3_FORCE_PATH_STYLE`."
outputs:
  download-path:
    description: "Path of artifact download"
runs:
  using: "node24"
  main: "../dist/download/index.js"
